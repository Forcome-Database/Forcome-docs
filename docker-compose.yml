# =============================================================================
# Docmost Docker Compose - 基础层
# 用法：不要直接使用此文件，通过 setup.sh/setup.bat 启动
#   ./setup.sh dev up    → 开发环境
#   ./setup.sh prod up   → 生产环境
# =============================================================================

services:
  redis:
    image: redis:8
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - docmost-network

volumes:
  redis_data:
  docmost_storage:

networks:
  docmost-network:
