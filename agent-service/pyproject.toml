[project]
name = "docmost-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-google-genai>=4.0,<5.0",
    "firecrawl-py>=4.0,<5.0",
    "tavily-python>=0.5",
    "Pillow>=10.0",
    "httpx>=0.27",
    "sse-starlette>=2.0,<4.0",
    "pydantic>=2.0",
    "pydantic-ai>=1.72.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0,<8.0",
    "trafilatura>=2.0.0",
    "imagehash>=4.3",
    "pybreaker>=1.0",
    "cachetools>=5.0,<8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests requiring running LLM",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
